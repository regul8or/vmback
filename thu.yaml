pools:
  - id: Supermicro-6019
    hosts: [ 172.18.0.25, 172.18.0.26, 172.18.0.27, 172.18.0.28 ]
    scope: [ 'metadata', 'vm', 'vdi', 'host' ]

env:
  backup-path: '/mnt/backup/temp'
  log-path: '/var/log/vmback'
  pool-metadata-template: '{pool_name}.xml'
  vdi-template: '{vm_name} - {device}.vhd'
  vm-metadata-template: '{vm_name}.tar'
  vm-template: '{vm_name}.xva'

vdi:
  - vm-uuid: fde030bb-bbb9-a7a2-3097-18763c9aa875
    vm-name: 'Ansible'
  - vm-uuid: 8b3af57b-8fb5-46ed-8815-79c1be4d1ad1
    vm-name: 'Git Server'
  - vm-uuid: a2ac7d8b-c064-faab-142d-e5443878f57b
    vm-name: 'imapsync'
  - vm-uuid: 6f982251-e19d-9207-332e-d7087b3e86b2
    vm-name: 'MS SQL Server 1'
  - vm-uuid: 9afea372-252e-7c3d-184c-dca4f4efdbf8
    vm-name: 'MySQL Server 3'
  - vm-uuid: 1e766823-eacd-a5b4-29bf-21be931c3b49
    vm-name: 'PostgreSQL Server 1'
  - vm-uuid: 868b0da1-f889-d475-7b32-2961cdca4cac
    vm-name: 'Rsyslog Server'
  - vm-uuid: 97421c95-7f9f-2c15-0761-5ae9beaa9490
    vm-name: 'Web Server 2'

xe:
  pool-dump-database: 'xe -s {host} -u {username} -pw {password} pool-dump-database file-name="{filename}"'
  vdi-export: 'xe -s {host} -u {username} -pw {password} vdi-export uuid={uuid} format=vhd filename="{filename}"'
  vm-export: 'xe -s {host} -u {username} -pw {password} vm-export uuid={uuid} metadata={metadata} filename="{filename}"'

after:
#  metadata:
#    - 'echo "After pool metadata backup"'
  vm:
    - 'borg2 --repo /mnt/backup/xen/vm/{vm_name_escaped} rcreate --encryption=none --make-parent-dirs'
    - 'borg2 --repo /mnt/backup/xen/vm/{vm_name_escaped} create --list {y:04}-{m:02}-{d:02} {vm_name_escaped}*'
    - 'rm {vm_name_escaped}*'
  vdi:
    - 'borg2 --repo /mnt/backup/xen/vm/{vm_name_escaped} rcreate --encryption=none --make-parent-dirs'
    - 'borg2 --repo /mnt/backup/xen/vm/{vm_name_escaped} create --list {y:04}-{m:02}-{d:02} {vm_name_escaped}*'
    - 'rm {vm_name_escaped}*'
#  host:
#    - 'echo "After each host backup"'
  job:
    - 'borg2 --repo /mnt/backup/xen/pool rcreate --encryption=none --make-parent-dirs'
    - 'borg2 --repo /mnt/backup/xen/pool create --list {y:04}-{m:02}-{d:02} *.xml'
    - 'rm *.xml'
