pools:
  - id: Home
    hosts: [ 192.168.1.49 ]
    scope: [ 'metadata', 'vm' ]

env:
  backup-path: 'X:\vm'
  log-path: 'X:\log'
  pool-metadata-template: '{pool_name}.xml'
  vdi-template: '{vm_name} - {device}.vhd'
  vm-metadata-template: '{vm_name}.tar'
  vm-template: '{vm_name}.xva'

# Export method configuration (NEW in v2.1.0)
export:
  # Method: 'xe' (legacy, requires xe CLI) or 'http' (direct XenAPI, recommended)
  method: 'http'  # Default: 'xe' for backward compatibility
  
  # HTTP export settings (used when method='http')
  http:
    scheme: 'http'  # or 'https' for production
    verify_ssl: false  # Set true if using valid SSL certificates
    timeout: 3600  # HTTP timeout in seconds (1 hour for large exports)
    chunk_size: 8388608  # Download chunk size in bytes (8MB recommended)
  
  # Async export settings (Phase 2 - prepared but not yet used)
  async:
    pool_metadata: false  # Pool metadata is always fast, keep sync
    vm_metadata: false    # VM metadata is always fast, keep sync
    vm_full: true         # Full VM exports are slow, use async (Phase 2)
    vdi: true             # VDI exports are slow, use async (Phase 2)

# vm-postpone:
#  - vm-uuid: 'ba47e2c7-9b02-2683-ee6d-1bf9f3c85cc7'
#    vm-name: 'App Server'

vm:
  - vm-uuid: 'ba47e2c7-9b02-2683-ee6d-1bf9f3c85cc7'
    vm-name: 'App Server'
  - vm-uuid: 'cd61472d-a9d8-e04e-ac7f-96e317d57679'
    vm-name: 'Domain Controller'
  - vm-uuid: '963991be-02df-c69c-a7fd-f4f779b5cb94'
    vm-name: 'Machine Learning'
  - vm-uuid: '22556e83-4ba9-98d9-a67a-b725cd3943a6'
    vm-name: 'MQTT Server'
  - vm-uuid: 'aa8b7796-f5ed-e19a-2c8c-be858da92a2e'
    vm-name: 'MySQL Server'
  - vm-uuid: '3b2b64fb-b3ab-613e-a8a0-e89450c27e05'
    vm-name: 'PostgreSQL Server'
  - vm-uuid: '2e3180e9-02b2-a754-2158-f9966ac56271'
    vm-name: 'Transmission'
  - vm-uuid: 'ae310646-a4d5-6f16-789f-b9768836f349'
    vm-name: 'Web Server'

# Legacy XE method (still supported for backward compatibility)
# These are used when export.method='xe' or export section is missing
xe:
  pool-dump-database: 'xe -s {host} -u {username} -pw {password} pool-dump-database file-name="{filename}"'
  vdi-export: 'xe -u {username} -pw {password} -s {host} vdi-export uuid={uuid} format=vhd filename="{filename}"'
  vm-export: 'xe -u {username} -pw {password} -s {host} vm-export uuid={uuid} metadata={metadata} filename="{filename}"'

#before:
#  job:  # Before entire backup job
#    - 'echo "Starting backup at %date%"'
#  metadata:  # Before pool metadata export
#    - 'echo "Exporting {pool_name} metadata"'
#  vm:  # Before each VM backup
#    - 'echo "Backing up {vm_name}"'
#  vdi:  # Before each VDI backup
#    - 'echo "Backing up {vm_name} - {device}"'

after:
#  metadata:
#    - 'echo "After pool metadata backup"'
  vm:
    - 'xcopy /y "{vm_name}*" backup\'
  vdi:
    - 'xcopy /y "{vm_name}*" backup\'
#   host:
#     - 'echo "After each host backup"'
  job:
    - 'xcopy /y *.xml backup\'

resilience:
  log:
    on_error: 'continue'  # Silent fallback to console-only logging
  backup:
    on_error: 'fail'  # Stop entire backup job on first failure
  hooks:
    on_error: 'warn'  # Log warning, continue backup
  network:
    max_retries: 3           # Maximum retry attempts
    retry_delay: 5           # Initial delay in seconds
    backoff_multiplier: 2.0  # Exponential backoff multiplier
    max_delay: 60            # Maximum delay between retries
